<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
    
    body{
        text-align: center;
        color: white;
    }

    .content{
        margin: auto;
        background-color:rgb(88, 144, 255);
        width: 500px;
        height:400px;
        padding: 50px;
        box-shadow:0px 4px 8px 0px rgba(0, 0, 0, 0.2);
    }
    


</style>

<body>

<br><br><br><br><br>
<div class="content">
<h2>Electricity Consumption Classifier</h2>
<input type="text" id="Energy" class="form-control" placeholder="type here..."> <!--asks for user input-->

<br>
<button class="btn btn-primary" onclick="ClassifyEnergy()">Consumption Classification</button>  
<br><br>
<p>Please input a non-negative integer for your energy consumption.</p>
    
    <script>
        //ClassifyEnergy

        function ClassifyEnergy(){

            var energy = document.getElementById("Energy").value; //id is the id of the input box so it will get the input.
            

        if (isNaN(energy) || energy < 0){
            alert("Please input a valid number.");//checks if input is valid number
        }

            else if(energy <= 100){
                alert("Lifeline Consumer: Discounted electricity rates")
            } 

            else if(energy <= 200){
                alert("Low Consumption: Normal residential rates") 
            }
            
            else if(energy <= 300){
                alert("Average Consumption: Typical Electricity usage") 
            }            
        
            else if(energy <= 500){
                alert("High Consumption: Higher Electricity usage") 
            }    

            else{
                alert("Very High Consumption: Heavy electricity users.")
            }
            
            }

    </script>
</div>

</body>
</html>
